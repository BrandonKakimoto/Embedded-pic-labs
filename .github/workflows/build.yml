name: Lab CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code (full history, for authorship)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hygiene, provided files, lint, authorship
        run: bash .github/scripts/repo-checks.sh

      - name: Upload checks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report-checks-run${{ github.run_number }}
          path: ci-report-checks.json
          if-no-files-found: ignore
          retention-days: 90
