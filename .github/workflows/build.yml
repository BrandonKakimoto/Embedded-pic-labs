name: Lab CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code (full history, for authorship)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hygiene, provided files, lint, authorship
        run: bash .github/scripts/repo-checks.sh

      - name: Upload checks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report-checks-run${{ github.run_number }}
          path: ci-report-checks.json
          if-no-files-found: ignore
          retention-days: 90

  build:
    name: Compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/jpl-cpp/xc8-ci:3.10
      credentials:
        username: JPL11
        password: ${{ secrets.GHCR_PULL_TOKEN }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Compile every project (xc8-cc -Wall / pic-as)
        run: bash .github/scripts/ci-build.sh

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report-build-run${{ github.run_number }}
          path: ci-report-build.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload firmware (download from this run's Artifacts to flash a CI-built hex)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-run${{ github.run_number }}
          path: '*.X/firmware.hex'
          if-no-files-found: ignore
          retention-days: 14
